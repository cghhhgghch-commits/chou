name: Android Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Configure production environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are required"
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env.production

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/laqta-upload-key.jks
          else
            echo "ANDROID_KEYSTORE_BASE64 is not configured. Generating a temporary fallback signing key for CI build."
            keytool -genkeypair \
              -v \
              -keystore android/laqta-upload-key.jks \
              -storepass "android123" \
              -alias "laqta-ci" \
              -keypass "android123" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -dname "CN=Laqta CI, OU=Engineering, O=Laqta, L=Remote, ST=Remote, C=SY"
            export ANDROID_STORE_PASSWORD="android123"
            export ANDROID_KEY_ALIAS="laqta-ci"
            export ANDROID_KEY_PASSWORD="android123"
          fi

          cat > android/keystore.properties <<EOF
          storeFile=laqta-upload-key.jks
          storePassword=${ANDROID_STORE_PASSWORD:-android123}
          keyAlias=${ANDROID_KEY_ALIAS:-laqta-ci}
          keyPassword=${ANDROID_KEY_PASSWORD:-android123}
          EOF

      - name: Build signed Android artifacts
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laqta-android-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error